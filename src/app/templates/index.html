{% extends 'base.html' %}
{% block content %}
<div x-data="{ loading:false }" class="max-w-2xl mx-auto">
  <h1 class="text-2xl font-semibold mb-4">Prediction</h1>
  <form hx-post="/api/predict" hx-trigger="submit" hx-target="#result" hx-swap="innerHTML" @submit="loading=true" @htmx:after-request="loading=false" class="space-y-4 bg-white p-6 rounded shadow">
    <div>
      <label class="block text-sm font-medium">Feature A</label>
      <input name="payload[feature_a]" type="text" class="mt-1 w-full border rounded px-3 py-2" required>
    </div>
    <div>
      <label class="block text-sm font-medium">Feature B</label>
      <input name="payload[feature_b]" type="text" class="mt-1 w-full border rounded px-3 py-2">
    </div>
    <div>
      <label class="block text-sm font-medium">Feature C</label>
      <input name="payload[feature_c]" type="text" class="mt-1 w-full border rounded px-3 py-2">
    </div>
    <button type="submit" class="btn bg-blue-600 text-white px-4 py-2 rounded-md" :class="{ 'opacity-50 pointer-events-none': loading }">
      <span x-show="!loading">Submit</span>
      <span x-show="loading">Submitting...</span>
    </button>
  </form>
  <div id="result" class="mt-4"></div>
</div>
{% endblock %}
