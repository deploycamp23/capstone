[project]
name = "capstone"
version = "0.1.0"
description = "MLOps Capstone Project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.2.1",
    "dvc>=3.61.0",
    "dvc-s3>=3.2.2",
    "fastapi[standard]>=0.116.1",
    "granian>=2.5.0",
    "numpy>=2.3.2",
    "pandas>=2.3.1",
    "polars>=1.31.0",
    "ruamel-yaml>=0.18.14",
    "structlog>=25.4.0",
    "torch>=2.7.1",
    "watchfiles>=1.1.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.4.5",
    "matplotlib>=3.10.5",
    "scikit-learn>=1.7.1",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
